<script>
// Hover a highlight card to play its demo clip. Cards without a <video>
// (autostitching) simply keep their static image.
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

document.querySelectorAll('.highlight-card').forEach(card => {
    const video = card.querySelector('.highlight-video');
    if (!video) return;

    // Some browsers only honour autoplay when muted is set as a property,
    // not just as an HTML attribute.
    video.muted = true;

    video.addEventListener('canplay', () => video.classList.add('ready'), { once: true });

    card.addEventListener('mouseenter', () => {
        if (reduceMotion.matches) return;
        // play() rejects if the pointer leaves again before loading finishes
        video.play().catch(() => {});
    });

    card.addEventListener('mouseleave', () => {
        video.pause();
        video.currentTime = 0; // next hover starts the demo from the beginning
    });
});
</script>
